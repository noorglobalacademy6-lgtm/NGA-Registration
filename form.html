<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نور گلوبل اکیڈمی - رجسٹریشن فارم</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Tahoma, Arial, sans-serif; background: #eef2f3; margin: 0; padding: 15px; text-align: right; }
    .form-box { max-width: 500px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #1e3c72; text-align: center; margin-top: 0; font-size: 22px; border-bottom: 2px solid #1e3c72; padding-bottom: 10px; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; }
    input[type="text"], input[type="email"], input[type="tel"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; text-align: right; }
    
    .checkbox-group { background: #f9f9f9; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-top: 5px; }
    .checkbox-item { display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; }
    .checkbox-item input { margin-left: 10px; width: 18px; height: 18px; cursor: pointer; }
    .group-title { font-size: 13px; color: #1e3c72; font-weight: bold; margin-top: 10px; margin-bottom: 5px; border-bottom: 1px dashed #ccc; padding-bottom: 3px; }

    button { width: 100%; padding: 12px; background: #1e3c72; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 20px; cursor: pointer; font-weight: bold; }
    button:hover { background: #152b52; }
    #msg { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="form-box">
  <h2>طالب علم رجسٹریشن فارم</h2>
  <form id="regForm">
    <label>پورا نام:</label>
    <input type="text" id="full_name" placeholder="اپنا نام درج کریں" required>

    <label>والد کا نام:</label>
    <input type="text" id="father_name" placeholder="والد کا نام درج کریں" required>

    <label>ای میل:</label>
    <input type="email" id="email" placeholder="example@mail.com" required>

    <label>فون نمبر:</label>
    <input type="tel" id="phone" placeholder="03001234567" required>

    <label>اسکول سیکشن / کلاس (اگر لاگو ہو):</label>
    <select id="school_class">
      <option value="ضرورت نہیں / صرف کورسز">ضرورت نہیں / صرف کورسز</option>
      <option value="پلے گروپ / نرسری / کے جی">پلے گروپ / نرسری / کے جی</option>
      <option value="کلاس 1 تا 5 (پرائمری)">کلاس 1 تا 5 (پرائمری)</option>
      <option value="کلاس 6 تا 8 (مڈل)">کلاس 6 تا 8 (مڈل)</option>
      <option value="کلاس 9 اور 10 (میٹرک)">کلاس 9 اور 10 (میٹرک)</option>
    </select>

    <label>مطلوبہ کورسز (ایک یا ایک سے زائد منتخب کر سکتے ہیں):</label>
    <div class="checkbox-group">
      <div class="group-title">دیloftی و اسلامی کورسز:</div>
      <label class="checkbox-item"><input type="checkbox" name="course" value="عربی زبان"> عربی زبان</label>
      <label class="checkbox-item"><input type="checkbox" name="course" value="علوم اسلامیہ"> علوم اسلامیہ</label>
      <label class="checkbox-item"><input type="checkbox" name="course" value="تجوید القرآن"> تجوید القرآن</label>
      <label class="checkbox-item"><input type="checkbox" name="course" value="حفظ القرآن"> حفظ القرآن</label>

      <div class="group-title">آئی ٹی و کمپیوٹر کورسز:</div>
      <label class="checkbox-item"><input type="checkbox" name="course" value="ویب ڈویلپمنٹ (Web Dev)"> ویب ڈویلپمنٹ (Web Dev)</label>
      <label class="checkbox-item"><input type="checkbox" name="course" value="گرافک ڈیزائننگ"> گرافک ڈیزائننگ</label>
      <label class="checkbox-item"><input type="checkbox" name="course" value="بنیادی کمپیوٹر (MS Office)"> بنیادی کمپیوٹر (MS Office)</label>
      <label class="checkbox-item"><input type="checkbox" name="course" value="ڈیجیٹل مارکیٹنگ"> ڈیجیٹل مارکیٹنگ</label>
    </div>

    <button type="submit" id="subBtn">جمع کریں</button>
  </form>
  <div id="msg"></div>
</div>

<script>
  const SUPABASE_URL = "https://qepaxfuhwnjgjlmsblpi.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlcGF4ZnVod25qZ2psbXNibHBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjMxNTksImV4cCI6MjEwMzkzOTE1OX0.-kfPjpQbQSdS5oIXExrWPHvqyh6ZiOnukCV1zLBDft4";

  document.getElementById('regForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('subBtn');
    const msg = document.getElementById('msg');

    // منتخب شدہ کورسز اکٹھے کرنا
    const selectedBoxes = document.querySelectorAll('input[name="course"]:checked');
    const coursesArray = Array.from(selectedBoxes).map(cb => cb.value);

    if (coursesArray.length === 0) {
      msg.style.color = "red";
      msg.innerText = "براہ کرم کم از کم ایک کورس ضرور منتخب کریں۔";
      return;
    }

    btn.disabled = true;
    btn.innerText = "پروسیسنگ...";
    msg.innerText = "";

    const formData = {
      full_name: document.getElementById('full_name').value,
      father_name: document.getElementById('father_name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      school_class: document.getElementById('school_class').value,
      selected_courses: coursesArray.join(', ') // تمام منتخب کورسز کو ایک ساتھ ملا کر بھیجنا
    };

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/NGA_Registrations`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(formData)
      });

      if (response.ok) {
        msg.style.color = "green";
        msg.innerText = "آپ کی رجسٹریشن کامیابی کے ساتھ ہو گئی ہے!";
        document.getElementById('regForm').reset();
      } else {
        const errData = await response.json();
        throw new Error(errData.message || response.statusText);
      }
    } catch (err) {
      msg.style.color = "red";
      msg.innerText = "خرابی: " + err.message;
    } finally {
      btn.disabled = false;
      btn.innerText = "جمع کریں";
    }
  });
</script>

</body>
</html>
<button onclick="exportToExcel()" style="background:#28a745; color:white; padding:10px 15px; border:none; border-radius:5px; margin-right:10px; cursor:pointer;">
    Excel میں ڈاؤن لوڈ کریں
</button>

<button onclick="exportToPDF()" style="background:#dc3545; color:white; padding:10px 15px; border:none; border-radius:5px; cursor:pointer;">
    PDF میں ڈاؤن لوڈ کریں
</button>
